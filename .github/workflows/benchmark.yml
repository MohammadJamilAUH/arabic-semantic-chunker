name: benchmark
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Space-separated sentence-transformers models"
        default: "intfloat/multilingual-e5-small intfloat/multilingual-e5-base sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
      docs:
        description: "Documents per run"
        default: "200"
  push:
    branches: [main]
    paths: ["arabic_chunker/**", "benchmarks/**", ".github/workflows/benchmark.yml"]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODELS: ${{ inputs.models || 'intfloat/multilingual-e5-small intfloat/multilingual-e5-base sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2' }}
      DOCS: ${{ inputs.docs || '200' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.MODELS }}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[transformers]"
      - name: Run
        run: |
          set -o pipefail
          run() {
            echo "### $1" | tee -a results.md
            shift
            python benchmarks/run_benchmark.py --docs "$DOCS" "$@" | tee -a results.md
            echo | tee -a results.md
          }
          for flags in "" "--paragraphs"; do
            run "HashingEmbedder $flags" $flags
            for m in $MODELS; do
              run "$m $flags" --model "$m" $flags
            done
          done
          cat results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results.md
